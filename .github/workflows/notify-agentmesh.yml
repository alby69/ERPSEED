name: Notify AgentMesh of ERPSEED Updates

on:
  push:
    branches: [main]
    paths:
      - 'backend/modules/**'
      - 'backend/core/api/**'
      - 'docs/API.md'
      - 'backend/openapi.json'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Dispatch
        if: ${{ secrets.AGENTMESH_PAT != '' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.AGENTMESH_PAT }}
          repository: alby69/agentmesh
          event-type: erpseed-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'

      - name: Skip Dispatch Notice
        if: ${{ secrets.AGENTMESH_PAT == '' }}
        run: |
          echo "AGENTMESH_PAT secret is not configured. Skipping cross-repo notification to alby69/agentmesh."
